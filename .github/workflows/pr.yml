name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  hugo-build:
    name: hugo-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.121.1"
          extended: true
      - name: Build
        run: hugo --minify

  content-rule-check:
    name: content-rule-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
      - name: Setup Python
        uses: actions/setup-python@82c7e631b6f8f6d8e4d8e5dfc36c4cb9d3ed1ea6 # v5
        with:
          python-version: "3.x"
      - name: Validate required sections and links
        run: python .github/scripts/validate_content.py

  internal-link-check:
    name: internal-link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
      - name: Setup Python
        uses: actions/setup-python@82c7e631b6f8f6d8e4d8e5dfc36c4cb9d3ed1ea6 # v5
        with:
          python-version: "3.x"
      - name: Validate internal links use relref/ref
        run: python .github/scripts/internal_link_check.py
