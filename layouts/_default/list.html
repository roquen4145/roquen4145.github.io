{{ define "main" }}
<section class="list-page">
  <header class="post-header">
    <p class="eyebrow">Section</p>
    <h1>{{ .Title }}</h1>
    {{ with .Summary }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  <div class="card-grid">
    {{ range .Pages }}
    <article class="card">
      <p class="eyebrow">{{ .Section | title }}</p>
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      {{ with .Summary }}<p class="summary">{{ . }}</p>{{ end }}
      <p class="meta"><time datetime="{{ .Date }}">{{ .Date.Format "2006-01-02" }}</time></p>
    </article>
    {{ end }}
  </div>
</section>
{{ end }}
