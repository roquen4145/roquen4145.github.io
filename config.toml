baseURL = "https://roquen4145.github.io/"
languageCode = "ko-kr"
title = "Quiet Systems"
defaultContentLanguage = "ko"
enableRobotsTXT = true
enableGitInfo = true
summaryLength = 40
assetDir = "assets"
disableKinds = ["RSS"]

[pagination]
  pagerSize = 10

[permalinks]
  "/" = "/:sections/:slug/"

[taxonomies]
  tag = "tags"

[params]
  description = "Second Order Thinking"
  searchIndex = "index.json"
  [params.analytics]
    provider = "plausible"
    domain = "roquen4145.github.io"
    script = "https://plausible.io/js/script.js"
    enabled = false

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML"]
  page = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[privacy]
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.x]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    disable = true
